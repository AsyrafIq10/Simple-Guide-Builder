openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: GBJ SolarDAMS API — Phase 1 (Asset Registry, Maintenance, Customer Portal, Housing Developer)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Portfolio dashboard summaries
  - name: customers
    description: Customer management
  - name: sites
    description: Site management
  - name: assets
    description: PV asset management
  - name: equipment
    description: Equipment register
  - name: workorders
    description: Work order management
  - name: projects
    description: Housing developer projects
  - name: units
    description: Housing unit solar tracker

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Portfolio-level KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-work-orders:
    get:
      operationId: getRecentWorkOrders
      tags: [dashboard]
      summary: Recent work orders for dashboard feed
      responses:
        "200":
          description: Recent work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"

  /dashboard/asset-status-breakdown:
    get:
      operationId: getAssetStatusBreakdown
      tags: [dashboard]
      summary: Count of assets grouped by status
      responses:
        "200":
          description: Status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/warranty-expiring:
    get:
      operationId: getWarrantyExpiring
      tags: [dashboard]
      summary: Equipment with warranties expiring within 90 days
      responses:
        "200":
          description: Expiring warranties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"

  # ─── Customers ───────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Sites ───────────────────────────────────────────────────
  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List all sites
      responses:
        "200":
          description: Site list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/{siteId}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site by ID
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: Not found
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── PV Assets ───────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all PV assets
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PvAsset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a PV asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PvAssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvAsset"

  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get a PV asset by ID
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PV Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvAsset"
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update a PV asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PvAssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PvAsset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete a PV asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Equipment ───────────────────────────────────────────────
  /assets/{assetId}/equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List equipment for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Register equipment on an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{equipmentId}:
    get:
      operationId: getEquipment
      tags: [equipment]
      summary: Get equipment by ID
      parameters:
        - name: equipmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
        "404":
          description: Not found
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: equipmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete equipment
      parameters:
        - name: equipmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Work Orders ─────────────────────────────────────────────
  /work-orders:
    get:
      operationId: listWorkOrders
      tags: [workorders]
      summary: List all work orders
      responses:
        "200":
          description: Work order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"
    post:
      operationId: createWorkOrder
      tags: [workorders]
      summary: Create a work order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{workOrderId}:
    get:
      operationId: getWorkOrder
      tags: [workorders]
      summary: Get a work order by ID
      parameters:
        - name: workOrderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "404":
          description: Not found
    patch:
      operationId: updateWorkOrder
      tags: [workorders]
      summary: Update a work order
      parameters:
        - name: workOrderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
    delete:
      operationId: deleteWorkOrder
      tags: [workorders]
      summary: Delete a work order
      parameters:
        - name: workOrderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Housing Developer Projects ───────────────────────────────
  /developer-projects:
    get:
      operationId: listDeveloperProjects
      tags: [projects]
      summary: List housing developer projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeveloperProject"
    post:
      operationId: createDeveloperProject
      tags: [projects]
      summary: Create a housing developer project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProject"

  /developer-projects/{projectId}:
    get:
      operationId: getDeveloperProject
      tags: [projects]
      summary: Get a housing developer project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProject"
        "404":
          description: Not found
    patch:
      operationId: updateDeveloperProject
      tags: [projects]
      summary: Update a housing developer project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProject"
    delete:
      operationId: deleteDeveloperProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /developer-projects/{projectId}/summary:
    get:
      operationId: getDeveloperProjectSummary
      tags: [projects]
      summary: Get installation progress summary for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"

  # ─── Housing Units ────────────────────────────────────────────
  /developer-projects/{projectId}/units:
    get:
      operationId: listHousingUnits
      tags: [units]
      summary: List housing units for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HousingUnit"
    post:
      operationId: createHousingUnit
      tags: [units]
      summary: Create a housing unit
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingUnitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingUnit"

  /housing-units/{unitId}:
    get:
      operationId: getHousingUnit
      tags: [units]
      summary: Get a housing unit by ID
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingUnit"
        "404":
          description: Not found
    patch:
      operationId: updateHousingUnit
      tags: [units]
      summary: Update a housing unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingUnitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingUnit"
    delete:
      operationId: deleteHousingUnit
      tags: [units]
      summary: Delete a housing unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Storage ──────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ─── Attachments ──────────────────────────────────────
  /attachments:
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: List attachments for a site or asset
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [site, asset]
        - name: entityId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      tags: [attachments]
      operationId: createAttachment
      summary: Save attachment metadata after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /attachments/{attachmentId}:
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment record
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Dashboard ─────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - totalAssets
        - totalInstalledKwp
        - totalSites
        - totalCustomers
        - openWorkOrders
        - overdueWorkOrders
        - warrantiesExpiringSoon
        - assetsWithoutMonitoring
      properties:
        totalAssets:
          type: integer
        totalInstalledKwp:
          type: number
        totalSites:
          type: integer
        totalCustomers:
          type: integer
        openWorkOrders:
          type: integer
        overdueWorkOrders:
          type: integer
        warrantiesExpiringSoon:
          type: integer
        assetsWithoutMonitoring:
          type: integer

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    # ─── Customer ──────────────────────────────────────────
    Customer:
      type: object
      required: [id, customerType, name, email, createdAt]
      properties:
        id:
          type: integer
        customerType:
          type: string
          enum: [residential, commercial, industrial, government]
        name:
          type: string
        identityOrRegistrationNumber:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        billingAddress:
          type: ["string", "null"]
        serviceAddress:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    CustomerInput:
      type: object
      required: [customerType, name, email]
      properties:
        customerType:
          type: string
          enum: [residential, commercial, industrial, government]
        name:
          type: string
          minLength: 1
        identityOrRegistrationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        billingAddress:
          type: string
        serviceAddress:
          type: string

    CustomerUpdate:
      type: object
      properties:
        customerType:
          type: string
          enum: [residential, commercial, industrial, government]
        name:
          type: string
        identityOrRegistrationNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        billingAddress:
          type: string
        serviceAddress:
          type: string

    # ─── Site ─────────────────────────────────────────────
    Site:
      type: object
      required: [id, siteName, siteCode, address, siteType, status, createdAt]
      properties:
        id:
          type: integer
        customerId:
          type: ["integer", "null"]
        siteName:
          type: string
        siteCode:
          type: string
        address:
          type: string
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        siteType:
          type: string
          enum: [residential, commercial, industrial, utility_scale, government]
        gridRegion:
          type: ["string", "null"]
        utilityProvider:
          type: ["string", "null"]
        commissioningDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, under_construction, decommissioned]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    SiteInput:
      type: object
      required: [siteName, siteCode, address, siteType, status]
      properties:
        customerId:
          type: integer
        siteName:
          type: string
          minLength: 1
        siteCode:
          type: string
          minLength: 1
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        siteType:
          type: string
          enum: [residential, commercial, industrial, utility_scale, government]
        gridRegion:
          type: string
        utilityProvider:
          type: string
        commissioningDate:
          type: string
        status:
          type: string
          enum: [active, inactive, under_construction, decommissioned]

    SiteUpdate:
      type: object
      properties:
        customerId:
          type: integer
        siteName:
          type: string
        siteCode:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        siteType:
          type: string
          enum: [residential, commercial, industrial, utility_scale, government]
        gridRegion:
          type: string
        utilityProvider:
          type: string
        commissioningDate:
          type: string
        status:
          type: string
          enum: [active, inactive, under_construction, decommissioned]

    # ─── PV Asset ─────────────────────────────────────────
    PvAsset:
      type: object
      required: [id, siteId, assetName, assetCode, systemType, currentStatus, createdAt]
      properties:
        id:
          type: integer
        siteId:
          type: integer
        assetName:
          type: string
        assetCode:
          type: string
        systemType:
          type: string
          enum: [grid_tied, hybrid, off_grid, nem, nem2]
        installedCapacityKwp:
          type: ["number", "null"]
        acCapacityKw:
          type: ["number", "null"]
        interconnectionType:
          type: ["string", "null"]
        commissioningDate:
          type: ["string", "null"]
        designLifeYears:
          type: ["integer", "null"]
        currentStatus:
          type: string
          enum: [operational, fault, offline, under_maintenance, decommissioned]
        monitoringStatus:
          type: string
          enum: [active, inactive, not_configured]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    PvAssetInput:
      type: object
      required: [siteId, assetName, assetCode, systemType, currentStatus]
      properties:
        siteId:
          type: integer
